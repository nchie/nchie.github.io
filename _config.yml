title: nchie.github.io
email: hello@terranchie.se
description: Personal site and blog.
url: https://nchie.github.io
baseurl: "" # For project pages, set to "/repo-name"
repository: nchie/nchie.github.io
linkedin: https://www.linkedin.com/in/andré-terranchie-10a97416a/
github: https://github.com/nchie

permalink: /:categories/:title/
markdown: kramdown
theme: null

plugins:
  - jekyll-seo-tag

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      categories: blog
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json

sass:
  style: compressed

giscus:
  # Required: replace with your repo and IDs from giscus settings
  repo: nchie/nchie.github.io
  repo_id: "R_kgDOQb2RDw"
  category: "Announcements"
  category_id: "DIC_kwDOQb2RD84CynXr"
  mapping: pathname
  reactions_enabled: "1"
  emit_metadata: "0"
  data_input_position: "bottom"
  theme: light
  lang: en
